name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar proyecto Android
        run: |
          flutter create --platforms=android --project-name vainilla_clothes --org com.vainilla tmp_app
          cp -r tmp_app/android ./android
          rm -rf tmp_app
          sed -i 's/android:label="[^"]*"/android:label="Vainilla Clothes"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: vainilla-clothes-apk
          path: build/app/outputs/flutter-apk/app-release.apk
